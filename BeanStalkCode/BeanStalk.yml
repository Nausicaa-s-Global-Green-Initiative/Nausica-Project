{
  "Outputs": {},
  "AWSTemplateFormatVersion": "2010-09-09",
  "Parameters": {
    "NumThreads": {
      "NoEcho": "true",
      "Type": "Number",
      "Description": "The number of threads to create to handle requests in each daemon process.",
      "Default": 15
    },
    "InstanceTypeFamily": {
      "NoEcho": "true",
      "Type": "String",
      "Description": "WebServer EC2 instance type family"
    },
    "LogPublicationControl": {
      "ConstraintDescription": "must be Boolean.",
      "NoEcho": "true",
      "Type": "String",
      "Description": "If true customer service logs will be published to S3.",
      "AllowedValues": [
        "true",
        "false"
      ],
      "Default": "false"
    },
    "InstancePort": {
      "NoEcho": "true",
      "Type": "String",
      "Description": "Listen Port",
      "Default": "80"
    },
    "XRayEnabled": {
      "NoEcho": "true",
      "Type": "String",
      "Description": "Enables AWS X-Ray for your environment.",
      "Default": "false"
    },
    "AWSEBEnvironmentId": {
      "NoEcho": "true",
      "Type": "String"
    },
    "HooksPkgUrl": {
      "NoEcho": "true",
      "Type": "String",
      "Description": "Hooks package URL",
      "Default": "https://elasticbeanstalk-platform-assets-eu-west-1.s3.eu-west-1.amazonaws.com/stalks/eb_python313_amazon_linux_2023_1.0.308.0_20250125002605/lib/hooks.tar.gz"
    },
    "NumProcesses": {
      "NoEcho": "true",
      "Type": "Number",
      "Description": "The number of daemon processes to start for WSGIDaemonProcess.",
      "Default": 1
    },
    "AWSEBEnvironmentName": {
      "NoEcho": "true",
      "Type": "String"
    },
    "AWSEBReferrerId": {
      "Default": "",
      "NoEcho": "true",
      "Type": "String"
    },
    "AppSource": {
      "NoEcho": "true",
      "Type": "String",
      "Description": "The url of the application source.",
      "Default": "https://elasticbeanstalk-platform-assets-eu-west-1.s3.eu-west-1.amazonaws.com/stalks/eb_python313_amazon_linux_2023_1.0.308.0_20250125002605/sampleapp/EBSampleApp-Python.zip"
    },
    "ProxyServer": {
      "NoEcho": "true",
      "Type": "String",
      "Description": "Application Proxy Server",
      "Default": "nginx"
    },
    "EnvironmentVariables": {
      "NoEcho": "true",
      "Type": "CommaDelimitedList",
      "Description": "Program environment variables.",
      "Default": "PYTHONPATH=/var/app/venv/staging-LQM1lest/bin"
    },
    "AWSEBAgentId": {
      "Default": "",
      "NoEcho": "true",
      "Type": "String"
    },
    "InstanceType": {
      "ConstraintDescription": "must be a valid EC2 instance type.",
      "NoEcho": "true",
      "Type": "String",
      "Description": "WebServer EC2 instance type"
    },
    "AWSEBEnvironmentBucket": {
      "NoEcho": "true",
      "Type": "String"
    },
    "WSGIPath": {
      "NoEcho": "true",
      "Type": "String",
      "Description": "The relative path of the WSGI script.",
      "Default": "application"
    },
    "ProxyStaticFiles": {
      "NoEcho": "true",
      "Type": "CommaDelimitedList",
      "Description": "A mapping from virtual path to physical path.",
      "Default": ""
    }
