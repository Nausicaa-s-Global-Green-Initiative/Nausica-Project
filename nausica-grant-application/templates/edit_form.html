<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Grant Application</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">

    <script>
        function validateFundingAmount() {
            let input = document.getElementById('funding-amount');
            input.addEventListener('input', function() {
                let value = parseInt(input.value, 10);
                if (isNaN(value) || value < 0 || value > 10000) {
                    input.setCustomValidity('Please enter a value between 0 and 10000');
                } else {
                    input.setCustomValidity('');
                }
            });
        }

        function toggleSpecialAwardDetails() {
            let checkbox = document.getElementById('special-award-checkbox');
            let textarea = document.getElementById('special-award-details');

            checkbox.addEventListener('change', function() {
                if (checkbox.checked) {
                    textarea.disabled = false;
                } else {
                    textarea.disabled = true;
                    textarea.value = ''; // Clear the text when unchecked
                }
            });

            // Initially disable the textarea if the checkbox is unchecked
            textarea.disabled = !checkbox.checked;
        }

        function setupCancelButton() {
            let cancelButton = document.querySelector('.cancel-btn');
            if (cancelButton) {
                cancelButton.addEventListener('click', function() {
                    window.location.href = this.getAttribute('data-url');
                });
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            validateFundingAmount();
            toggleSpecialAwardDetails();
            setupCancelButton();
        });
    </script>
</head>
<body>
    <div class="container">
        <h1>Edit Grant Application</h1>
        <h2>Update Application Details</h2>
        <h3>Modify the fields below and submit</h3>

        <div class="form-container">
            {% if record %}
            <form method="POST" action="{{ url_for('update_application', id=record.grant_application_id) }}">
                <div class="form-group">
                    <label for="first-name">First Name</label>
                    <input type="text" id="first-name" name="first-name" value="{{ record.first_name }}" required>
                </div>

                <div class="form-group">
                    <label for="last-name">Last Name</label>
                    <input type="text" id="last-name" name="last-name" value="{{ record.last_name }}" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" value="{{ record.email }}" required>
                </div>

                <div class="form-group">
                    <label for="grant-type">Grant Type</label>
                    <input type="text" id="grant-type" name="grant-type" value="{{ record.grant_type }}" readonly>
                </div>

                <div class="form-group">
                    <label for="funding-amount">Funding Amount</label>
                    <input type="number" id="funding-amount" name="funding-amount" value="{{ record.funding_amount }}" required min="0" max="10000">
                    <small id="error_message" style="color: red; display: none;">Please enter an amount between €0 and €10,000.</small>
                </div>

                <div class="form-group checkbox-group">
                    <label for="special-award-checkbox">Special Award Application</label>
                    <input type="checkbox" id="special-award-checkbox" name="special-award-checkbox"
                           {% if record.special_award == 1 %}checked{% endif %}>
                </div>

                <div class="form-group">
                    <label for="special-award-details">Special Award Details</label>
                    <textarea id="special-award-details" name="special-award-details" rows="4">{{ record.award_details }}</textarea>
                </div>

                <div class="button-group">
                    <button type="submit" class="submit-btn">Update</button>
                    <button type="button" class="cancel-btn" data-url="{{ url_for('listview') }}">Cancel</button>
                </div>
            </form>
            {% else %}
                <p>No record found.</p>
            {% endif %}
        </div>
    </div>
</body>
</html>
