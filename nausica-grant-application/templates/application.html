<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grant Application System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <script>
        function validateFundingAmount() {
            let input = document.getElementById('funding-amount');
            input.addEventListener('input', function() {
                let value = parseInt(input.value, 10);
                if (isNaN(value) || value < 0 || value > 10000) {
                    input.setCustomValidity('Please enter a value between 0 and 10000');
                } else {
                    input.setCustomValidity('');
                }
            });
        }

        function toggleSpecialAwardDetails() {
            let checkbox = document.getElementById('special-award-checkbox');
            let textarea = document.getElementById('special-award-details');

            checkbox.addEventListener('change', function() {
                if (checkbox.checked) {
                    textarea.disabled = false;
                } else {
                    textarea.disabled = true;
                    textarea.value = ''; // Clear the text when unchecked
                }
            });

            // Initially disable the textarea
            textarea.disabled = !checkbox.checked;
        }

        document.addEventListener("DOMContentLoaded", function() {
            validateFundingAmount();
            toggleSpecialAwardDetails();
        });
    </script>
</head>
<body>
    <div class="container">
        <h1>Welcome to Nausicaa Green Grant</h1>
        <h2>Application Form</h2>
        <h3>Please fill in the form below</h3>
        <div class="form-container">
            <form action="{{ url_for('submit_application') }}" method="POST">
                <!-- CSRF Token -->
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="form-group">
                    <label for="first-name">First Name</label>
                    <input type="text" id="first-name" name="first-name" required>
                </div>
                <div class="form-group">
                    <label for="last-name">Last Name</label>
                    <input type="text" id="last-name" name="last-name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="grant-type">Grant Type</label>
                    <input type="text" id="grant-type" name="grant-type" value="Teto" readonly>
                </div>
                
                <div class="form-group">
                    <label for="funding-amount">Funding Amount</label>
                    <input type="number" id="funding-amount" name="funding-amount" required min="0" max="10000">
                    <small id="error_message" style="color: red; display: none;">Please enter an amount between €0 and €10,000.</small>
                </div>

                <div class="form-group checkbox-group">
                    <label for="special-award-checkbox">Special Award Application</label>
                    <input type="checkbox" id="special-award-checkbox" name="special-award-checkbox">
                </div>

                <div class="form-group">
                    <label for="special-award-details">Special Award Details</label>
                    <textarea id="special-award-details" name="special-award-details" rows="4"></textarea>
                </div>
                <div class="button-group">
                    <button type="submit" class="submit-btn">Submit</button>
                    <button type="button" class="cancel-btn" onclick="window.location.href='{{ url_for('home') }}'">Cancel</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
