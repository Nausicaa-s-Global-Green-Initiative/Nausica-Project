<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Nausicaa Green Grant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">

    <style>
        body {
            background: url('{{ url_for('static', filename='images/background.png') }}') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.9); /* Light background */
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            width: 40%;
            max-width: 500px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
        }

        h1, h2 {
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            font-weight: bold;
            color: black;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .button-group {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .submit-btn, .cancel-btn {
            padding: 10px 20px;
            font-size: 16px;
            font-family: 'Titillium Web', sans-serif;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .submit-btn {
            background-color: #007bff;
            color: white;
        }

        .submit-btn:hover {
            background-color: #0056b3;
        }

        .cancel-btn {
            background-color: #dc3545;
            color: white;
        }

        .cancel-btn:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Admin Login</h1>
        <h2>Secure Access for IAM Users</h2>
        <form action="{{ url_for('admin_login') }}" method="POST">
            <div class="form-group">
                <label for="access_key">AWS Access Key</label>
                <input type="text" id="access_key" name="access_key" required>
            </div>

            <div class="form-group">
                <label for="secret_key">AWS Secret Key</label>
                <input type="password" id="secret_key" name="secret_key" required>
            </div>

          
            <div class="button-group">
                <button type="submit" class="submit-btn">Login</button>
                <button type="button" class="cancel-btn" onclick="window.location.href='{{ url_for('home') }}'">Cancel</button>
            </div>
        </form>
    </div>
</body>
</html>
