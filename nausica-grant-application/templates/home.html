<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grant Application System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <style>
        @import url('https://fonts.googleapis.com/css?family=Titillium+Web:300,400,600');

        body {
            background: url('{{ url_for('static', filename='images/background.png') }}') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .header {
            position: absolute;
            top: 20px;
            display: flex;
            gap: 20px;
        }

        /* Universal Button Styling */
        .btn {
            padding: 10px 20px;
            font-size: 16px;
            font-family: 'Titillium Web', sans-serif; /* Ensures same font */
            font-weight: bold; /* Matches button styling */
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            text-decoration: none; /* Removes underline for <a> */
            display: flex; /* Ensures alignment */
            align-items: center;
            justify-content: center;
            height: auto;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        .container {
            background: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 10px;
            color: white;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <!-- Apply Grant button now has same style as Admin Login -->
        <a href="{{ url_for('apply') }}" class="btn">Apply Grant</a>
        <a href="{{ url_for('admin_login') }}" class="btn">Admin Login</a>
    </div>
    <div class="container">
        <h1>Grant Application System</h1>
    </div>
</body>
</html>
